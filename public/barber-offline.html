<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101916" />
    <title>لا يوجد اتصال — إكس مانس إكس XMANSX</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
        background: linear-gradient(180deg, #14201b 0%, #0d1611 60%, #0b1310 100%);
        color: #fff;
        font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 26rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.05);
        padding: 2rem 1.5rem;
        box-shadow: 0 40px 120px -40px rgba(0, 0, 0, 0.8);
      }
      .logo {
        width: 4.5rem;
        height: 4.5rem;
        margin: 0 auto 1.25rem;
        display: block;
        border-radius: 1rem;
        background: #fff;
        object-fit: cover;
      }
      .rule {
        height: 1px;
        margin: 1.5rem 0;
        background: linear-gradient(90deg, transparent, rgba(169, 130, 69, 0.6), transparent);
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0.75rem 0 0;
        font-size: 0.95rem;
        line-height: 1.9;
        color: rgba(255, 255, 255, 0.7);
      }
      .note {
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.45);
        line-height: 1.8;
      }
      button {
        margin-top: 1.5rem;
        width: 100%;
        min-height: 3.25rem;
        border: 0;
        border-radius: 0.85rem;
        background: linear-gradient(180deg, #c19a55 0%, #a98245 55%, #8f6c39 100%);
        color: #fff;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 20px -10px rgba(169, 130, 69, 0.6);
      }
      button:active {
        transform: scale(0.99);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/icons/xmansx-icon-192.png" alt="إكس مانس إكس XMANSX" />
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>إكس مانس إكس XMANSX يقرأ المبالغ والنقاط من الخادم دائمًا، فلا يعرض لك أرقامًا قد تكون قديمة.</p>
      <div class="rule"></div>
      <p class="note">تحقّق من اتصال الجوال أو شبكة الصالون، ثم أعد المحاولة.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
