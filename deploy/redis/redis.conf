# Private cache/rate-limit Redis for XMANSX. Do not expose port 6379 publicly.
bind 127.0.0.1 ::1
protected-mode yes
port 6379
timeout 0
tcp-keepalive 300

# All application keys have an expiry. Keep memory bounded and evict only expiring keys.
maxmemory 256mb
maxmemory-policy volatile-lru

# Rate limits can safely rebuild after a restart; persistence is intentionally disabled.
save ""
appendonly no
