server_tokens off;

upstream xmansx_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name xmansx.com www.xmansx.com *.xmansx.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xmansx.com www.xmansx.com *.xmansx.com;

    # Install a Cloudflare Origin CA certificate before enabling Full (strict).
    ssl_certificate /etc/ssl/cloudflare/xmansx.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/xmansx.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    client_max_body_size 2m;
    keepalive_timeout 65;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # real_ip أعلاه لا يثق إلا بعناوين Cloudflare؛ لا نمرر سلسلة يحقنها العميل.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://xmansx_next;
    }
}
